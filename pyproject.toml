[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "listofpublicationsfrominspirehep"
version = "0.1.2"
description = "Create and validate publication lists from INSPIREHEP and generate LaTeX/PDF output"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [
  { name = "Ruggero Turra" },
]
keywords = ["bibtex", "inspirehep", "latex", "publications", "cli"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Topic :: Scientific/Engineering :: Information Analysis",
  "Topic :: Text Processing :: Markup :: LaTeX",
]
dependencies = [
  "bibtexparser>=1.4.4,<2",
  "requests",
  "tqdm",
]

[project.urls]
Homepage = "https://github.com/wiso/ListOfPublicationsFromInspireHEP"
Repository = "https://github.com/wiso/ListOfPublicationsFromInspireHEP"
Issues = "https://github.com/wiso/ListOfPublicationsFromInspireHEP/issues"

[project.scripts]
check_biblio = "check_biblio:main"
create_bibtex = "create_bibtex:main"
create_latex = "create_latex:main"

[tool.setuptools]
py-modules = ["check_biblio", "create_bibtex", "create_latex"]