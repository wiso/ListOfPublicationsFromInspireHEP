[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "listofpublicationsfrominspirehep"
version = "0.1.0"
description = "Create and validate publication lists from INSPIREHEP and generate LaTeX/PDF output"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
  "bibtexparser==2.0.0b4",
  "requests",
  "tqdm",
]

[project.scripts]
check_biblio = "check_biblio:main"
create_bibtex = "create_bibtex:main"
create_latex = "create_latex:main"

[tool.setuptools]
py-modules = ["check_biblio", "create_bibtex", "create_latex"]